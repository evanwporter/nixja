[project]
name = "nixja"
version = "0.2.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
authors = [{ name = "Evan Porter", email = "evanwporter@gmail.com" }]
dependencies = ["jinja2"]

[project.scripts]
nixja = "nixja.nixja:main"
nixja-gen = "nixja.nixja_gen:main"

[tool.setuptools.package-data]
nixja = ["*.j2", "nixja-gen.py"]

[tool.pyrefly]
project-includes = ["src", "hello"]
search-path = ["src"]
preset = "default"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
